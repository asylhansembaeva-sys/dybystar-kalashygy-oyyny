tileArea.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch'||e.button!==0)return;
 const t=e.target.closest('.tile');if(t)beginDrag(t.dataset.id,e.clientX,e.clientY,'pointer');
});
document.addEventListener('pointermove',e=>{
 if(dragging?.kind==='pointer')moveDrag(e.clientX,e.clientY);
});
document.addEventListener('pointerup',e=>{
 if(dragging?.kind==='pointer')endDrag(e.clientX,e.clientY);
});
document.addEventListener('pointercancel',()=>{if(dragging?.kind==='pointer')endDrag(0,0,true)});
$('start').onclick=()=>{$('intro').classList.add('hidden');$('game').classList.remove('hidden');render()};$('prev').onclick=()=>{page=Math.max(0,page-1);render()};$('next').onclick=()=>{page++;render()};$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 Дыбыс өшірулі':'🔊 Дыбыс қосулы'};$('reset').onclick=()=>{stage=0;page=0;selected=null;placements={};$('message').textContent='';$('message').classList.remove('success');transitioning=false;$('game').classList.add('hidden');$('intro').classList.remove('hidden')};function autoComplete(){if(transitioning)return;const data=current();if(!data.every(x=>placements[x.id]===x.letter))return;transitioning=true;audio();fireworks();$('message').textContent='🎉 ЖАРАЙСЫҢ! 🎉';$('message').classList.add('success');setTimeout(()=>{if(stage<stages.length-1){stage++;page=0;placements={};$('message').textContent='';$('message').classList.remove('success');transitioning=false;render()}else{$('message').textContent='🏆 ЖАРАЙСЫҢ! Барлық кезең аяқталды!';$('message').classList.add('success')}},2600)}
$('check').onclick=()=>{if(transitioning)return;let data=current();if(data.some(x=>placements[x.id]===undefined)){$('message').textContent='Алдымен барлық суретті үйшіктерге орналастыр!';return}let wrong=data.filter(x=>placements[x.id]!==x.letter);if(wrong.length){wrong.forEach(x=>delete placements[x.id]);$('message').textContent=`${wrong.length} сурет қате орналастырылды. Қайта көр!`;page=0;render();return}autoComplete()};
</script></body></html>
